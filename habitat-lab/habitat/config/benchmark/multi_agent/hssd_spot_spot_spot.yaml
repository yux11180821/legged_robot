# @package _global_
# D-HRL reproduction: THREE Spot robots (EXPERIMENTAL scalability config).
#
# Differences vs hssd_spot_spot.yaml:
#   * adds agent_2 (spot, same light sensors, same base velocity action);
#   * drops did_agents_collide / num_agents_collide / rearrange_cooperate_reward:
#     those measures hardcode exactly 2 agents (multi_agent_sensors.py:45-48).
#     The D-HRL adapter falls back to its distance-threshold proximity penalty.
#   * reward/success measures switch to pddl_subgoal_reward / pddl_success
#     (loadability only; the trainers compute the real team reward themselves).
#
# Start positions are runtime-sampled (min_distance_start_agents), so 2-agent
# episode data still works; PDDL grounding with a third unreferenced agent is
# the main untested risk -> run dhrl_habitat/preflight.py first.

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: task_config_base

  - /habitat/simulator/sensor_setups@habitat.simulator.agents.agent_0: depth_head_agent
  - /habitat/simulator/agents@habitat.simulator.agents.agent_0: spot

  - /habitat/simulator/sensor_setups@habitat.simulator.agents.agent_1: depth_head_agent
  - /habitat/simulator/agents@habitat.simulator.agents.agent_1: spot

  - /habitat/simulator/sensor_setups@habitat.simulator.agents.agent_2: depth_head_agent
  - /habitat/simulator/agents@habitat.simulator.agents.agent_2: spot

  - /habitat/dataset/rearrangement: hssd

  - /habitat/task/actions@habitat.task.actions.agent_0_base_velocity: base_velocity_non_cylinder
  - /habitat/task/actions@habitat.task.actions.agent_1_base_velocity: base_velocity_non_cylinder
  - /habitat/task/actions@habitat.task.actions.agent_2_base_velocity: base_velocity_non_cylinder

  - /habitat/task/measurements:
    - pddl_success
    - num_steps
    - composite_stage_goals
    - pddl_subgoal_reward
  - /habitat/task/lab_sensors:
    - localization_sensor
  - _self_

habitat:
  task:
    type: RearrangePddlTask-v0
    reward_measure: pddl_subgoal_reward
    success_measure: pddl_success
    success_reward: 10.0
    min_distance_start_agents: 5.0
    slack_reward: -0.0005
    end_on_success: False
    constraint_violation_ends_episode: False
    constraint_violation_drops_object: True
    measurements:
      pddl_success:
        must_call_stop: False
    task_spec_base_path: benchmark/multi_agent/
    task_spec: pddl/multi_agent_tidy_house
    pddl_domain_def: fp
    actions:
      agent_0_base_velocity:
        lin_speed: 10.0
        longitudinal_lin_speed: 10.0
        lateral_lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
        enable_lateral_move: False
        collision_threshold: 1e-5
        enable_rotation_check_for_dyn_slide: False
      agent_1_base_velocity:
        lin_speed: 10.0
        longitudinal_lin_speed: 10.0
        lateral_lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
        enable_lateral_move: False
        collision_threshold: 1e-5
        enable_rotation_check_for_dyn_slide: False
      agent_2_base_velocity:
        lin_speed: 10.0
        longitudinal_lin_speed: 10.0
        lateral_lin_speed: 10.0
        ang_speed: 10.0
        allow_dyn_slide: True
        enable_lateral_move: False
        collision_threshold: 1e-5
        enable_rotation_check_for_dyn_slide: False
  gym:
    obs_keys:
      - agent_0_localization_sensor
      - agent_1_localization_sensor
      - agent_2_localization_sensor
  environment:
    max_episode_steps: 500
  simulator:
    type: RearrangeSim-v0
    seed: 100
    additional_object_paths:
      - "data/objects/ycb/configs/"
      - "data/objects/amazon_berkeley/configs/"
      - "data/objects/google_object_dataset/configs/"
    concur_render: True
    auto_sleep: True
    agents_order:
      - agent_0
      - agent_1
      - agent_2

    kinematic_mode: True
    ac_freq_ratio: 1
    step_physics: False

    habitat_sim_v0:
      allow_sliding: True
      enable_physics: True
    agents:
      agent_0:
        joint_start_noise: 0.0
      agent_1:
        joint_start_noise: 0.0
      agent_2:
        joint_start_noise: 0.0
  dataset:
    data_path: data/datasets/hssd/rearrange/{split}/social_rearrange.json.gz
