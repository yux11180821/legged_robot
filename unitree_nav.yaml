# D-HRL multi-agent Habitat reproduction config
#
# The filename is kept only because earlier scripts referenced it.  The content
# is no longer a single-agent Unitree navigation config.

project:
  default_dir: /root/autodl-tmp/habitat-lab
  habitat_config: social_nav/social_nav.yaml
  task_family: multi_agent_social_nav

training:
  default_experiment: dhrl_social_nav_2algorithms
  seeds: [100, 200, 300, 400]
  total_steps_per_seed: 2000000
  num_environments: 8
  checkpoint_interval_frames: 100000
  log_interval: 10

algorithms:
  dhrl:
    label: Distributed HRL (RNN memory)
    habitat_access_manager: MultiAgentAccessMgr
    updater: HRLPPO
    distributed_updater: HRLDDPPO
    recurrent_middle_layer: LSTM
    paper_role: main method

  no_memory:
    label: No Spatiotemporal Memory
    habitat_access_manager: MultiAgentAccessMgr
    updater: HRLPPO
    distributed_updater: HRLDDPPO
    recurrent_middle_layer: NONE
    paper_role: Fig. 5 / Table 1 ablation

outputs:
  tensorboard: tb/dhrl_social_nav_2algorithms/{algorithm}/seed_{seed}
  checkpoints: data/checkpoints/dhrl_social_nav_2algorithms/{algorithm}/seed_{seed}
  logs: logs/dhrl_social_nav_2algorithms/{algorithm}/seed_{seed}.log
  shadow_plot: results/dhrl_social_nav_2algorithms/dhrl_multi_agent_reward_shadow.png
