# skrl MAPPO config for the per-leg quadruped MARL env (CENTRALIZED critic / CTDE).
# Schema = skrl 2.1.0 Runner (matches Isaac Lab's shipped Direct-MARL mappo cfgs).
#
# MARL contract:
#   policy (per-leg actor)   input = OBSERVATIONS  -> only that leg's proprioception
#   value  (centralized critic) input = STATES     -> full robot state via env._get_states()
# This OBSERVATIONS-vs-STATES split is what makes it MAPPO (CTDE) rather than IPPO.

seed: 42

models:
  separate: True
  policy:  # per-agent actor -> Gaussian over the 3 leg-joint actions
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS      # per-leg proprioception ONLY (no global state)
        layers: [256, 256, 128]
        activations: elu
    output: ACTIONS
  value:  # centralized critic -> reads the shared global STATE
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES            # full robot state -> centralized value
        layers: [256, 256, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1  # auto = agent.rollouts

agent:
  class: MAPPO
  rollouts: 24
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  observation_preprocessor: RunningStandardScaler   # normalizes per-agent obs
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler         # normalizes the shared global state
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.005
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: True   # bootstrap value on time-limit truncation (correct GAE)
  experiment:
    directory: "quadruped_four_legs_marl"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 120000   # = max_iterations * agent.rollouts; train.py overrides via --max_iterations
  environment_info: log
